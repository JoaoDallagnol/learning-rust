[package]
name = "axum_template"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.6"
serde = {version = "1", features = ["derive"]}
serde_json =  "1"
serde_with = "3"
tower-http = {version = "0.4", features = ["fs"]}
tower-cookies = "0.9"
lazy-regex = "2"
async-trait = "0.1"
strum_macros = "0.27"
uuid = { version = "1", features = ["v4", "fast-rng"] }
derive_more = { version = "2", features = ["from", "display"] }

[dev-dependencies]
anyhow = "1"
httpc-test = "0.1.1"
